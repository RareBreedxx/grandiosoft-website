apiVersion: apps/v1
kind: Deployment
metadata:
  name: grandiosoft-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: grandiosoft-web
  template:
    metadata:
      labels:
        app: grandiosoft-web
    spec:
      containers:
      - name: web
        image: grandiosoft-website:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 500m
            memory: 512Mi
        livenessProbe:
              httpGet:
                path: /
                port: 80
              initialDelaySeconds: 10
              periodSeconds: 10

        readinessProbe:
          httpGet:
            path: /
            port: 80
          initialDelaySeconds: 5
          periodSeconds: 5
    periodSeconds: 10

  readinessProbe:
    httpGet:
      path: /
      port: 80
    initialDelaySeconds: 5
    periodSeconds: 5
